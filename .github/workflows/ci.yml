name: CI

# Every suite that guards this repo. Branch protection requires these, so a
# PR cannot merge with a broken money engine, broken rules, or a broken build.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.11'
          cache: npm

      # the Firestore, Auth and Storage emulators are Java processes, and
      # firebase-tools refuses anything below 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      # strict TypeScript is only real if it is checked: vitest transpiles
      # without typechecking and esbuild strips types
      - name: Typecheck (all workspaces)
        run: npm run typecheck

      - name: Unit tests (shared domain logic)
        run: npm test -w @money-kids/shared

      - name: Security rules tests
        run: npm run test:rules

      - name: Cloud Functions tests
        run: npm run test:functions

      - name: App component tests
        run: npm run test:app

      - name: Build the app
        run: npm run build:app

      # build:deploy is the strict variant the predeploy hook uses, so drift
      # between deploy.lock.json and the installed tree fails CI instead of
      # warning. This covers the two top-level externals only: the staged
      # lockfile resolves its transitive tree independently of the root
      # lockfile, so transitives can still differ between what CI tests and
      # what prod runs.
      - name: Stage the functions bundle (strict)
        run: npm run build:deploy -w @money-kids/functions

      # The lock/manifest pair is exactly what failed the first deploy, and
      # npm ci is the only thing that really validates it. --workspaces=false
      # stops npm resolving workspace context from the repo root.
      - name: Validate the staged manifest installs
        working-directory: functions/deploy
        run: npm ci --omit=dev --workspaces=false

      # Compares against the contract stage.mjs emits, so "right count, wrong
      # names" cannot pass. The env vars stand in for what GCF injects; without
      # them any module-scope Firebase config read would fail confusingly.
      - name: Smoke test that the bundle loads
        working-directory: functions
        env:
          GCLOUD_PROJECT: money-kids-test
          FIREBASE_CONFIG: '{"projectId":"money-kids-test"}'
        run: npm run smoke -w @money-kids/functions

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.11'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: End-to-end (mobile viewport, against the emulators)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
