name: CI

# Every suite that guards this repo. Branch protection requires these, so a
# PR cannot merge with a broken money engine, broken rules, or a broken build.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.11'
          cache: npm

      # the Firestore, Auth and Storage emulators are Java processes, and
      # firebase-tools refuses anything below 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      # strict TypeScript is only real if it is checked: vitest transpiles
      # without typechecking and esbuild strips types
      - name: Typecheck (all workspaces)
        run: npm run typecheck

      - name: Unit tests (shared domain logic)
        run: npm test -w @money-kids/shared

      - name: Security rules tests
        run: npm run test:rules

      - name: Cloud Functions tests
        run: npm run test:functions

      - name: App component tests
        run: npm run test:app

      - name: Build the app
        run: npm run build:app

      # build:deploy is the strict variant the predeploy hook uses, so lock
      # drift fails CI instead of warning. Without it, CI could stay green
      # while prod deployed a different firebase-admin than CI tested against.
      - name: Stage the functions bundle (strict)
        run: npm run build:deploy -w @money-kids/functions

      # The lock/manifest pair is exactly what failed the first deploy, and
      # npm ci is the only thing that really validates it. --workspaces=false
      # stops npm resolving workspace context from the repo root.
      - name: Validate the staged manifest installs
        working-directory: functions/deploy
        run: npm ci --omit=dev --workspaces=false

      # Neither the metafile nor the import guards see a dynamic require from
      # inlined code, and the banner injects createRequire. Importing the
      # bundle is what actually catches a cold-start crash.
      - name: Smoke test that the bundle loads
        working-directory: functions/deploy
        run: node -e "import('./index.js').then(m => { const n = Object.keys(m).length; if (n !== 9) { throw new Error('expected 9 callables, got ' + n); } console.log('bundle loaded,', n, 'callables'); })"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.11'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: End-to-end (mobile viewport, against the emulators)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
