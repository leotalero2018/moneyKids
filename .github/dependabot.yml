# Dependabot updates the root manifests only. The deployed functions run on
# the separately-resolved tree in functions/deploy.lock.json, which the
# refresh-deploy-lock workflow keeps patched on a schedule.
#
# A firebase* bump here will fail CI's strict staging step until that lock is
# refreshed, because the lock and the installed tree then disagree. Fix it in
# the same PR with:
#
#   npm run stage:lock -w @money-kids/functions
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      firebase:
        patterns: ['firebase*', '@firebase/*']
    ignore:
      # firebase-admin 14 pulls jwks-rsa 4, which is CommonJS and requires
      # jose 6, which is ESM-only. require() of an ES module needs Node 22;
      # the functions runtime is Node 20, so the codebase fails to load and
      # takes out verify and e2e. Without this, dependabot re-raises a
      # permanently red PR every week and people learn to ignore red.
      #
      # CAVEAT: `ignore` suppresses security UPDATE PRs for this dependency,
      # not just version bumps — so a CVE fixed only in firebase-admin 14+
      # will not arrive as a proposed fix while this entry stands.
      #
      # Dependabot ALERTS are unaffected and still surface in the repository's
      # Security tab; `ignore` governs updates, not alerts. What is lost is the
      # automatic PR, not the notification. refresh-deploy-lock.yml also audits
      # the deployed tree weekly and fails on high or critical, so the finding
      # is visible in two places — but acting on it is manual either way.
      #
      # Remove this once #15 moves the runtime to Node 22 — that is also what
      # clears the remaining CVEs in #5.
      - dependency-name: firebase-admin
        versions: ['>=14.0.0']
